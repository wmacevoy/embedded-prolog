name: Tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  # ── macOS ─────────────────────────────────────────────────
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build qjson extension
        run: cd vendor/qjson && make qjson_ext.dylib

      - name: Python tests
        run: |
          python3 src/test_y8_datalog.py
          python3 examples/vending/test_datalog.py
          python3 examples/family/test_family.py
          python3 examples/tutorial/test_datalog.py

  # ── Ubuntu ────────────────────────────────────────────────
  debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build qjson extension
        run: cd vendor/qjson && make qjson_ext.so

      - name: Python tests
        run: |
          python3 src/test_y8_datalog.py
          python3 examples/vending/test_datalog.py
          python3 examples/family/test_family.py
          python3 examples/tutorial/test_datalog.py

      - name: JS tests
        run: |
          node src/test-parser.js

  # ── Alpine ────────────────────────────────────────────────
  alpine:
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps
        run: apk add --no-cache gcc musl-dev python3 bash make sqlite-dev

      - name: Build qjson extension
        run: cd vendor/qjson && make qjson_ext.so

      - name: Python tests
        run: |
          python3 src/test_y8_datalog.py
          python3 examples/vending/test_datalog.py
          python3 examples/family/test_family.py
          python3 examples/tutorial/test_datalog.py

  # ── Windows ───────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: JS tests
        shell: bash
        run: node src/test-parser.js
